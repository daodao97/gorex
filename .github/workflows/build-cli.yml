name: Build CLI

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64]
    env:
      GOWORK: 'off'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build and bundle CLI
        run: ./scripts/build-cli.sh --platform '${{ matrix.platform }}'

      - name: Test Linux CLI and session lifecycle
        if: matrix.platform == 'linux/amd64'
        env:
          GOREX_CLI_E2E: '1'
          GOREX_CLI_BINARY: '${{ github.workspace }}/build/cli/gorex-linux-amd64/gorex'
          MYGO_GHOSTTY_VT: '${{ github.workspace }}/build/cli/gorex-linux-amd64/libghostty-vt.so'
        run: go test -tags gorex_cli ./cmd/gorex ./internal/rex ./internal/remote ./internal/terminal/screen

      - name: Archive name
        id: artifact
        env:
          PLATFORM: '${{ matrix.platform }}'
        run: echo "name=GoRex-cli-${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload CLI
        uses: actions/upload-artifact@v7
        with:
          name: '${{ steps.artifact.outputs.name }}'
          path: |
            build/cli/*.tar.gz
            build/cli/*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
